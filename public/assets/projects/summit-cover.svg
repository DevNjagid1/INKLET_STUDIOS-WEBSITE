  <text x="120" y="515" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="300" letter-spacing="6" fill="url(#goldS)">CREATIVE SUMMIT 2026</text>
  <text x="120" y="550" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#8892B0">CHUKA CONVENTION CENTER • DESIGN, FILM &amp; CODE</text>
