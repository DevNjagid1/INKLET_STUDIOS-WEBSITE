  </defs>
  <rect width="800" height="600" fill="url(#summitBg)"/>
  <!-- Typographic Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="600" stroke="#2A354D" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="600" stroke="#2A354D" stroke-width="1"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#2A354D" stroke-width="1"/>
