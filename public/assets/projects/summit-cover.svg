  <polygon points="400,140 540,400 260,400" fill="#4263A5" fill-opacity="0.1" stroke="#4263A5" stroke-width="1.5"/>
  <circle cx="400" cy="100" r="8" fill="url(#goldS)"/>
  <text x="120" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#D4AF69">EASTERN KENYA REGIONAL ARTS FORUM</text>
