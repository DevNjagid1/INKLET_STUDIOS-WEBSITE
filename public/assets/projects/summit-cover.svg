      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#1A2234"/>
      <stop offset="100%" stop-color="#0B101D"/>
    </linearGradient>
    <linearGradient id="goldS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2C485"/>
      <stop offset="100%" stop-color="#D4AF69"/>
