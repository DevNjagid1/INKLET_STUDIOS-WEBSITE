<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="zenithCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2333"/>
      <stop offset="100%" stop-color="#0E1420"/>
    </linearGradient>
    <linearGradient id="goldZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8"/>
      <stop offset="50%" stop-color="#D4AF69"/>
      <stop offset="100%" stop-color="#A8813B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#141821"/>
  <!-- Card 1 Angled in 3D Perspective -->
  <g transform="translate(180, 160) rotate(-6)" filter="url(#cardShadow)">
    <rect width="420" height="250" rx="8" fill="url(#zenithCard)" stroke="#2F3B52" stroke-width="1.5"/>
    <!-- Subtle debossed gold crest -->
    <circle cx="80" cy="80" r="32" fill="none" stroke="url(#goldZ)" stroke-width="2"/>
    <polygon points="80,58 98,92 62,92" fill="none" stroke="url(#goldZ)" stroke-width="1.8"/>
    <circle cx="80" cy="78" r="3" fill="url(#goldZ)"/>
    <text x="140" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" letter-spacing="4" fill="url(#goldZ)">ZENITH</text>
    <text x="140" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#8892B0">LEGAL ADVOCATES LLP</text>
    <line x1="80" y1="140" x2="360" y2="140" stroke="url(#goldZ)" stroke-width="0.8" opacity="0.4"/>
    <text x="80" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#F8F5EF">Arthur M. Kamau, SC</text>
    <text x="80" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8892B0">Senior Managing Partner • Commercial Litigation</text>
    <text x="80" y="215" font-family="'Courier New', monospace" font-size="9" fill="#D4AF69">admissions@zenithadvocates.co.ke</text>
  </g>
  <text x="400" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" letter-spacing="6" fill="#D4AF69" text-anchor="middle">TACTILE STATIONERY &amp; EMBOSSED PRINT SYSTEM</text>
</svg>
